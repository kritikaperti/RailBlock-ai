version: '3.8'

services:
  railblock-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railblock-ai-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DOMAIN_NAME=abps.indianrailways.gov.in
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/network')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
